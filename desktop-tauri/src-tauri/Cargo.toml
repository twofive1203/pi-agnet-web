[package]
name = "snail-pi-pet-tauri-preview"
version = "0.1.0"
description = "Isolated Tauri shell feasibility preview for the Snail Pi desktop pet"
authors = ["Snail Pi"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "snail_pi_pet_tauri_preview_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "snail-pi-pet-tauri-preview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.3"
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"
