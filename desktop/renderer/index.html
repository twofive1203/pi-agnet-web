<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蜗牛派桌宠</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <div
      id="root"
      class="pet-root is-collapsed"
      data-tray-anchor="top-left"
      aria-live="polite"
    >
      <!-- pet-stack stays fixed on screen; tray grows around it via data-tray-anchor. -->
      <div class="pet-stack">
        <div class="pet-chrome">
          <!-- Native drag strip (backup). Pet body also supports click-vs-drag. -->
          <div class="pet-drag-bar" title="拖动桌宠" aria-hidden="true">
            <span class="pet-drag-dots"></span>
          </div>
          <button
            type="button"
            id="btn-hide"
            class="pet-chrome-btn pet-close-btn"
            title="隐藏到托盘"
            aria-label="隐藏到托盘"
          >
            ×
          </button>
        </div>

        <button
          type="button"
          id="pet-button"
          class="pet-surface"
          aria-label="桌宠，点击展开活动列表，拖动可移动"
          aria-expanded="false"
        >
          <div id="pet-avatar" class="pet-avatar frame-idle" data-state="idle">
            <span id="pet-glyph" class="pet-glyph" aria-hidden="true">·</span>
            <span class="pet-shell" aria-hidden="true"></span>
            <span class="pet-body" aria-hidden="true"></span>
          </div>
          <div id="pet-badge" class="pet-badge" hidden>0</div>
          <div id="pet-label" class="pet-label">空闲</div>
        </button>
      </div>

      <section id="activity-tray" class="activity-tray" hidden aria-label="活动列表">
        <header class="tray-header">
          <div>
            <strong id="tray-title">活动</strong>
            <span id="tray-counts" class="tray-counts"></span>
          </div>
          <div class="tray-actions">
            <button type="button" id="btn-mark-all" class="tray-btn">全部已读</button>
            <button type="button" id="btn-retry" class="tray-btn">重试</button>
            <button
              type="button"
              id="btn-hide-tray"
              class="tray-btn tray-btn-close"
              title="隐藏到托盘"
              aria-label="隐藏到托盘"
            >
              ×
            </button>
          </div>
        </header>
        <div id="connection-banner" class="connection-banner" hidden></div>
        <div id="auth-panel" class="auth-panel" hidden>
          <label class="auth-label" for="access-key-input">访问密钥</label>
          <input
            id="access-key-input"
            class="auth-input"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="粘贴 spi --server 启动时显示的密钥"
          />
          <div class="auth-actions">
            <button type="button" id="btn-save-key" class="tray-btn">连接</button>
            <button type="button" id="btn-clear-key" class="tray-btn" hidden>清除密钥</button>
          </div>
        </div>
        <div id="project-list" class="project-list" role="list"></div>
        <footer class="tray-footer">
          <button type="button" id="btn-copy-cmd" class="tray-btn" hidden>
            复制启动命令
          </button>
          <span id="stale-flag" class="stale-flag" hidden>数据可能已过期</span>
        </footer>
      </section>
    </div>
    <script src="./pet-app.js"></script>
  </body>
</html>
