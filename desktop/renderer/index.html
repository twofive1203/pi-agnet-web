<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蜗牛派桌宠</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <div
      id="root"
      class="pet-root is-collapsed"
      data-tray-anchor="top-left"
      data-bubble-theme="cream"
      aria-live="polite"
    >
      <!-- pet-stack stays fixed on screen; tray grows around it via data-tray-anchor. -->
      <div id="pet-stack" class="pet-stack">
        <div class="pet-chrome">
          <!-- Dragging happens on the pet body via click-vs-drag; no separate grip strip. -->
          <button
            type="button"
            id="btn-hide"
            class="pet-chrome-btn pet-close-btn"
            title="隐藏到托盘"
            aria-label="隐藏到托盘"
          >
            ×
          </button>
        </div>

        <button
          type="button"
          id="pet-button"
          class="pet-surface"
          aria-label="桌宠，点击展开活动列表，拖动可移动"
          aria-expanded="false"
        >
          <div class="pet-stage">
            <div id="pet-caption" class="pet-caption" hidden>
              <span id="pet-caption-state" class="pet-caption-state">空闲</span>
              <span id="pet-caption-title" class="pet-caption-title"></span>
            </div>
            <div id="pet-avatar" class="pet-avatar frame-idle" data-state="idle">
              <span class="pet-shadow" aria-hidden="true"></span>
              <span class="pet-tail" aria-hidden="true"></span>
              <span class="pet-body" aria-hidden="true"></span>
              <span class="pet-head" aria-hidden="true">
                <span class="pet-antenna pet-antenna-left"></span>
                <span class="pet-antenna pet-antenna-right"></span>
                <span class="pet-eye pet-eye-left"></span>
                <span class="pet-eye pet-eye-right"></span>
                <span class="pet-mouth"></span>
              </span>
              <span class="pet-shell" aria-hidden="true">
                <span class="pet-shell-spiral"></span>
              </span>
              <span id="pet-glyph" class="pet-glyph" aria-hidden="true">·</span>
            </div>
            <div id="pet-badge" class="pet-badge" hidden>0</div>
            <div id="pet-context-meter" class="pet-context-meter" hidden>
              <span class="pet-context-ring" aria-hidden="true"></span>
              <span id="pet-context-meter-label" class="pet-context-meter-label"></span>
            </div>
            <div id="pet-label" class="pet-label">空闲</div>
          </div>
        </button>
        <div id="pet-intent-menu" class="pet-intent-menu" role="group" aria-label="桌宠快捷操作">
          <button type="button" id="btn-pet-activity" class="pet-intent-btn" aria-expanded="false">
            活动
          </button>
          <button type="button" id="btn-pet-mark-all" class="pet-intent-btn">
            全部已读
          </button>
          <button type="button" id="btn-pet-quick-session" class="pet-intent-btn" hidden>
            快速会话
          </button>
          <button type="button" id="btn-pet-settings" class="pet-intent-btn">
            设置
          </button>
        </div>
      </div>

      <section id="activity-tray" class="activity-tray" hidden aria-label="活动列表">
        <header class="tray-header">
          <div>
            <strong id="tray-title">活动</strong>
            <span id="tray-counts" class="tray-counts"></span>
          </div>
          <div class="tray-actions">
            <div class="tray-overflow">
              <button
                type="button"
                id="btn-tray-more"
                class="tray-btn tray-btn-icon"
                title="更多操作"
                aria-label="更多操作"
                aria-expanded="false"
                aria-haspopup="menu"
              >
                ⋯
              </button>
              <div id="tray-more-menu" class="tray-menu" role="menu" hidden>
                <button type="button" id="btn-mark-all" class="tray-btn" role="menuitem">全部已读</button>
                <button type="button" id="btn-retry" class="tray-btn" role="menuitem">重试</button>
              </div>
            </div>
            <button
              type="button"
              id="btn-quick-session"
              class="tray-btn"
              title="快速会话"
              aria-label="快速会话"
              aria-expanded="false"
              hidden
            >
              快速会话
            </button>
            <button
              type="button"
              id="btn-settings"
              class="tray-btn tray-btn-icon"
              title="桌宠设置"
              aria-label="桌宠设置"
              aria-expanded="false"
            >
              ⚙
            </button>
            <button
              type="button"
              id="btn-hide-tray"
              class="tray-btn tray-btn-close"
              title="收起活动列表"
              aria-label="收起活动列表"
            >
              −
            </button>
          </div>
        </header>
        <div id="connection-banner" class="connection-banner" hidden></div>
        <div id="activity-filters" class="activity-filters" role="group" aria-label="筛选活动">
          <button type="button" class="activity-filter" data-activity-filter="all" aria-pressed="true">
            全部 <span data-filter-count>0</span>
          </button>
          <button type="button" class="activity-filter" data-activity-filter="attention" aria-pressed="false">
            需关注 <span data-filter-count>0</span>
          </button>
          <button type="button" class="activity-filter" data-activity-filter="running" aria-pressed="false">
            运行中 <span data-filter-count>0</span>
          </button>
          <button type="button" class="activity-filter" data-activity-filter="completed" aria-pressed="false">
            已完成 <span data-filter-count>0</span>
          </button>
        </div>
        <section id="settings-panel" class="settings-panel" hidden aria-label="桌宠设置">
          <div id="auth-panel" class="auth-panel" hidden>
            <label class="auth-label" for="access-key-input">连接 · 访问密钥</label>
            <input
              id="access-key-input"
              class="auth-input"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="粘贴 spi --server 启动时显示的密钥"
            />
            <div class="auth-actions">
              <button type="button" id="btn-save-key" class="tray-btn">连接</button>
              <button type="button" id="btn-clear-key" class="tray-btn" hidden>清除密钥</button>
            </div>
          </div>
          <div class="settings-card">
            <div class="settings-heading">角色</div>
            <label class="pet-picker-filter-label" for="pet-picker-filter">筛选角色</label>
            <input id="pet-picker-filter" class="pet-picker-filter" type="search" maxlength="40" placeholder="搜索名称" autocomplete="off" />
            <div id="pet-picker" class="pet-picker" role="radiogroup" aria-label="选择桌宠">
              <button type="button" class="pet-option" data-pet-id="snail-default" data-pet-key="snail:snail-default" role="radio">
                <span class="pet-option-preview preview-default" aria-hidden="true">◉</span>
                <span>星海蜗牛</span>
              </button>
              <button type="button" class="pet-option" data-pet-id="snail-classic" data-pet-key="snail:snail-classic" role="radio">
                <span class="pet-option-preview preview-classic" aria-hidden="true">◉</span>
                <span>经典蜗牛</span>
              </button>
              <button type="button" class="pet-option" data-pet-id="snail-sprite" data-pet-key="snail:snail-sprite" role="radio">
                <span class="pet-option-preview preview-sprite" aria-hidden="true">◉</span>
                <span>像素蜗牛</span>
              </button>
              <div id="custom-pet-options" class="custom-pet-options" hidden></div>
            </div>
          </div>
          <div class="settings-card">
            <div class="settings-heading">自定义桌宠</div>
            <div class="custom-pets-note">蜗牛派包：子目录内放 manifest.json + PNG/WebP。Codex 包：pet.json + spritesheet.webp，可放在同一目录或官方 hatch-pet 目录（%CODEX_HOME%/pets 或 ~/.codex/pets）。点击刷新后即可选择。ZIP 一键导入尚未支持，请先解压成目录。本地能加载不代表项目可再分发该角色。</div>
            <div id="custom-pets-path" class="custom-pets-path"></div>
            <div id="codex-pets-path" class="custom-pets-path" hidden></div>
            <div id="pet-catalog-diagnostics" class="pet-catalog-diagnostics" hidden></div>
            <div class="custom-pets-actions">
              <button type="button" id="btn-open-custom-pets" class="tray-btn">打开目录</button>
              <button type="button" id="btn-rescan-custom-pets" class="tray-btn">刷新列表</button>
            </div>
          </div>
          <div class="settings-card">
            <div class="settings-heading">尺寸</div>
            <div id="pet-scale-picker" class="pet-scale-picker" role="radiogroup" aria-label="桌宠尺寸">
              <button type="button" class="pet-scale-option" data-pet-scale="small" role="radio">小</button>
              <button type="button" class="pet-scale-option" data-pet-scale="medium" role="radio">中</button>
              <button type="button" class="pet-scale-option" data-pet-scale="large" role="radio">大</button>
            </div>
            <button type="button" id="btn-restore-position" class="tray-btn settings-restore-btn">
              恢复默认位置与尺寸
            </button>
            <p class="settings-hint">悬停角色打开快捷菜单。P 互动，Shift+P 摆动。拖动可移动。</p>
            <div class="settings-grid">
              <label class="setting-toggle">
                <input id="pref-always-on-top" type="checkbox" />
                <span>始终置顶</span>
              </label>
              <label class="setting-toggle">
                <input id="pref-launch-at-login" type="checkbox" />
                <span>开机启动</span>
              </label>
              <label class="setting-toggle setting-toggle-warning">
                <input id="pref-click-through" type="checkbox" />
                <span>鼠标穿透（可从系统托盘恢复）</span>
              </label>
              <label class="setting-toggle">
                <input id="pref-show-context-meter" type="checkbox" />
                <span>显示上下文占比</span>
              </label>
            </div>
          </div>
          <div class="settings-card">
            <div class="settings-heading">气泡</div>
            <div id="bubble-theme-picker" class="bubble-theme-picker" role="radiogroup" aria-label="气泡样式">
              <button type="button" class="bubble-theme-option" data-bubble-theme="cream" role="radio">
                <span class="bubble-theme-preview preview-bubble-cream" aria-hidden="true"></span>
                <span>奶油白</span>
              </button>
              <button type="button" class="bubble-theme-option" data-bubble-theme="peach" role="radio">
                <span class="bubble-theme-preview preview-bubble-peach" aria-hidden="true"></span>
                <span>蜜桃粉</span>
              </button>
              <button type="button" class="bubble-theme-option" data-bubble-theme="night" role="radio">
                <span class="bubble-theme-preview preview-bubble-night" aria-hidden="true"></span>
                <span>星夜</span>
              </button>
              <button type="button" class="bubble-theme-option" data-bubble-theme="ember" role="radio">
                <span class="bubble-theme-preview preview-bubble-ember" aria-hidden="true"></span>
                <span>余烬</span>
              </button>
              <button type="button" class="bubble-theme-option" data-bubble-theme="plum" role="radio">
                <span class="bubble-theme-preview preview-bubble-plum" aria-hidden="true"></span>
                <span>暮紫</span>
              </button>
              <button type="button" class="bubble-theme-option" data-bubble-theme="moss" role="radio">
                <span class="bubble-theme-preview preview-bubble-moss" aria-hidden="true"></span>
                <span>墨青</span>
              </button>
            </div>
          </div>
          <div class="settings-card">
            <div class="settings-heading">通知</div>
            <label class="setting-field">
              <span>完成通知</span>
              <select id="pref-completion" class="setting-select">
                <option value="never">从不</option>
                <option value="background-only">仅后台</option>
                <option value="always">始终</option>
              </select>
            </label>
            <div class="settings-grid settings-grid-compact">
              <label class="setting-toggle">
                <input id="pref-needs-input" type="checkbox" />
                <span>待输入</span>
              </label>
              <label class="setting-toggle">
                <input id="pref-blocked" type="checkbox" />
                <span>受阻/失败</span>
              </label>
            </div>
          </div>
          <div class="settings-card">
            <div class="settings-heading">声音</div>
            <div class="settings-grid">
              <label class="setting-toggle">
                <input id="pref-sound-master" type="checkbox" />
                <span>声音提示（默认关闭，开启后播放短促提示音）</span>
              </label>
            </div>
            <div class="settings-grid settings-grid-compact">
              <label class="setting-toggle">
                <input id="pref-sound-needs-input" type="checkbox" />
                <span>待输入提示音</span>
              </label>
              <label class="setting-toggle">
                <input id="pref-sound-completion" type="checkbox" />
                <span>完成提示音</span>
              </label>
            </div>
            <p id="sound-dnd-note" class="sound-dnd-note" hidden>声音已被勿扰模式静音</p>
          </div>
          <div class="settings-card">
            <div class="settings-heading">勿扰</div>
            <div class="settings-grid">
              <label class="setting-toggle">
                <input id="pref-dnd" type="checkbox" />
                <span>勿扰模式（暂停系统通知与状态气泡，状态仍实时更新）</span>
              </label>
            </div>
          </div>
        </section>
        <section id="quick-session-panel" class="quick-session-panel" hidden aria-label="快速会话">
          <p id="qs-status" class="qs-status" hidden></p>
          <div class="qs-toolbar">
            <div class="qs-field">
              <button
                type="button"
                id="qs-project-trigger"
                class="qs-chip"
                aria-expanded="false"
                aria-haspopup="listbox"
                aria-controls="qs-picker"
              >
                <span class="qs-chip-kicker">项目</span>
                <span id="qs-selected" class="qs-chip-value">选择项目</span>
              </button>
            </div>
            <div class="qs-field">
              <button
                type="button"
                id="qs-model-trigger"
                class="qs-chip"
                aria-expanded="false"
                aria-haspopup="listbox"
                aria-controls="qs-picker"
              >
                <span class="qs-chip-kicker">模型</span>
                <span id="qs-model-selected" class="qs-chip-value">默认模型</span>
              </button>
            </div>
            <div id="qs-picker" class="qs-picker" hidden>
              <input
                id="qs-picker-search"
                class="qs-input"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="搜索"
              />
              <div id="qs-picker-list" class="qs-picker-list" role="listbox" aria-label="可选项"></div>
              <p id="qs-picker-note" class="qs-note" hidden></p>
            </div>
          </div>
          <label class="qs-label" for="qs-message">首条消息</label>
          <textarea
            id="qs-message"
            class="qs-textarea"
            rows="6"
            maxlength="8000"
            placeholder="交代一句任务，Ctrl+Enter 启动"
          ></textarea>
          <div id="qs-count" class="qs-count" aria-live="polite"></div>
          <p id="qs-error" class="qs-error" hidden></p>
          <div id="qs-success" class="qs-success" hidden>
            <p id="qs-success-text" class="qs-success-text"></p>
            <div class="qs-actions">
              <button type="button" id="btn-qs-open" class="tray-btn">打开会话</button>
              <button type="button" id="btn-qs-another" class="tray-btn">再开一个</button>
            </div>
          </div>
          <div id="qs-edit-actions" class="qs-actions">
            <button type="button" id="btn-qs-cancel" class="tray-btn">取消</button>
            <button type="button" id="btn-qs-submit" class="tray-btn qs-submit" disabled>启动</button>
          </div>
        </section>
        <div id="project-list" class="project-list" role="listbox" aria-label="任务活动"></div>
        <footer class="tray-footer">
          <button type="button" id="btn-copy-cmd" class="tray-btn" hidden>
            复制启动命令
          </button>
          <span id="stale-flag" class="stale-flag" hidden>数据可能已过期</span>
        </footer>
      </section>
    </div>
    <script src="./pet-app.js"></script>
  </body>
</html>
